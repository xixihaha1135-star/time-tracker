<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间统计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
      color: #f0f6fc;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab {
      padding: 8px 20px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .tab:hover { border-color: #58a6ff; color: #c9d1d9; }
    .tab.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }
    .view { display: none; }
    .view.active { display: block; }
    .loading {
      text-align: center;
      padding: 60px;
      color: #8b949e;
    }
    .error {
      text-align: center;
      padding: 60px;
      color: #f85149;
    }
    /* Mobile */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      h1 { font-size: 20px; }
      .tab { padding: 6px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱ 时间统计</h1>
    <div class="tabs">
      <div class="tab active" data-view="calendar">日历热力图</div>
      <div class="tab" data-view="trend">趋势图</div>
      <div class="tab" data-view="report">分析报告</div>
    </div>
    <div id="calendar" class="view active">
      <div class="loading">加载中...</div>
    </div>
    <div id="trend" class="view">
      <div class="loading">加载中...</div>
    </div>
    <div id="report" class="view">
      <div class="loading">加载中...</div>
    </div>
  </div>
  <script>
    const DATA_URL = './records.json';
    let allData = null;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.view).classList.add('active');
      });
    });

    // Load data
    async function loadData() {
      try {
        const resp = await fetch(DATA_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        allData = await resp.json();
        renderAll();
      } catch (e) {
        document.querySelectorAll('.view').forEach(v => {
          v.innerHTML = '<div class="error">无法加载数据: ' + e.message + '</div>';
        });
      }
    }

    function renderAll() {
      if (!allData || !allData.records || allData.records.length === 0) {
        document.querySelectorAll('.view').forEach(v => {
          v.innerHTML = '<div class="loading">暂无记录</div>';
        });
        return;
      }
      renderCalendar();
      renderTrend();
      renderReport();
    }

    // Placeholder render functions — implemented in later tasks
    function renderCalendar() {
      document.getElementById('calendar').innerHTML = '<div class="loading">日历热力图开发中...</div>';
    }
    function renderTrend() {
      document.getElementById('trend').innerHTML = '<div class="loading">趋势图开发中...</div>';
    }
    function renderReport() {
      document.getElementById('report').innerHTML = '<div class="loading">分析报告开发中...</div>';
    }

    loadData();
  </script>
</body>
</html>
