<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间统计</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
      color: #f0f6fc;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tab {
      padding: 8px 20px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .tab:hover { border-color: #58a6ff; color: #c9d1d9; }
    .tab.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }
    .view { display: none; }
    .view.active { display: block; }
    .loading {
      text-align: center;
      padding: 60px;
      color: #8b949e;
    }
    .error {
      text-align: center;
      padding: 60px;
      color: #f85149;
    }
    /* Mobile */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      h1 { font-size: 20px; }
      .tab { padding: 6px 14px; font-size: 13px; }
    }
    /* Calendar Heatmap */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .calendar-header button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .calendar-header button:hover { border-color: #58a6ff; }
    .calendar-header span { font-size: 18px; font-weight: 600; color: #f0f6fc; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 8px;
    }
    .month-block {
      min-width: 0;
    }
    .month-title {
      text-align: center;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .day-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      background: #161b22;
      cursor: pointer;
      position: relative;
      min-width: 0;
    }
    .day-cell:hover { outline: 1px solid #58a6ff; }
    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.empty:hover { outline: none; }
    .day-label {
      font-size: 8px;
      color: #484f58;
      position: absolute;
      bottom: 1px;
      right: 2px;
    }
    .legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 16px;
      font-size: 12px;
      color: #8b949e;
    }
    .legend-cell {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
    .day-detail {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      min-width: 280px;
      max-width: 90vw;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .day-detail h3 {
      margin-bottom: 12px;
      color: #f0f6fc;
      font-size: 16px;
    }
    .day-detail .record-item {
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .day-detail .record-item:last-child { border-bottom: none; }
    .day-detail .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    @media (max-width: 768px) {
      .calendar-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .month-grid { gap: 1px; }
      .day-label { font-size: 6px; }
    }
    /* Trend Chart */
    .trend-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .trend-controls select, .trend-controls button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .trend-controls select:hover, .trend-controls button:hover { border-color: #58a6ff; }
    .trend-chart-wrapper {
      position: relative;
      height: 400px;
      background: #161b22;
      border-radius: 8px;
      padding: 16px;
    }
    .activity-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .activity-tag {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #30363d;
      background: #21262d;
      color: #8b949e;
      transition: all 0.2s;
    }
    .activity-tag.active { border-color: #58a6ff; color: #58a6ff; background: #0d1117; }
    @media (max-width: 768px) {
      .trend-chart-wrapper { height: 300px; padding: 8px; }
    }
    /* Analysis Report */
    .report-content {
      background: #161b22;
      border-radius: 8px;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    .report-section {
      margin-bottom: 24px;
    }
    .report-section h3 {
      color: #f0f6fc;
      font-size: 16px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }
    .report-stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }
    .report-stat .label { color: #8b949e; }
    .report-stat .value { color: #f0f6fc; font-weight: 600; }
    .report-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .report-bar .bar-label { width: 80px; text-align: right; color: #c9d1d9; }
    .report-bar .bar-track {
      flex: 1;
      height: 20px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
    }
    .report-bar .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    .report-bar .bar-value { width: 60px; color: #8b949e; font-size: 12px; }
    .change-up { color: #3fb950; }
    .change-down { color: #f85149; }
    .change-same { color: #8b949e; }
    .report-range-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }
    .report-range-controls button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .report-range-controls button.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }
    @media (max-width: 768px) {
      .report-content { padding: 16px; }
      .report-bar .bar-label { width: 60px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱ 时间统计</h1>
    <div class="tabs">
      <div class="tab active" data-view="calendar">日历热力图</div>
      <div class="tab" data-view="trend">趋势图</div>
      <div class="tab" data-view="report">分析报告</div>
    </div>
    <div id="calendar" class="view active">
      <div class="loading">加载中...</div>
    </div>
    <div id="trend" class="view">
      <div class="loading">加载中...</div>
    </div>
    <div id="report" class="view">
      <div class="loading">加载中...</div>
    </div>
  </div>
  <script>
    const DATA_URL = './records.json';
    let allData = null;

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.view).classList.add('active');
      });
    });

    // Load data
    async function loadData() {
      try {
        const resp = await fetch(DATA_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        allData = await resp.json();
        renderAll();
      } catch (e) {
        document.querySelectorAll('.view').forEach(v => {
          v.innerHTML = '<div class="error">无法加载数据: ' + e.message + '</div>';
        });
      }
    }

    function renderAll() {
      if (!allData || !allData.records || allData.records.length === 0) {
        document.querySelectorAll('.view').forEach(v => {
          v.innerHTML = '<div class="loading">暂无记录</div>';
        });
        return;
      }
      renderCalendar();
      renderTrend();
      renderReport();
    }

    // Placeholder render functions — implemented in later tasks
    function renderCalendar() {
      const container = document.getElementById('calendar');
      const records = allData.records;
      const currentYear = new Date().getFullYear();

      // Aggregate by date
      const dailyTotals = {};
      const dailyRecords = {};
      records.forEach(r => {
        if (!dailyTotals[r.date]) {
          dailyTotals[r.date] = 0;
          dailyRecords[r.date] = [];
        }
        dailyTotals[r.date] += r.duration_min;
        dailyRecords[r.date].push(r);
      });

      let viewYear = currentYear;

      function buildCalendar(year) {
        const yearKeys = Object.keys(dailyTotals).filter(k => k.startsWith(String(year)));
        const yearVals = yearKeys.map(k => dailyTotals[k]);
        const maxMin = yearVals.length > 0 ? Math.max(...yearVals) : 1;

        function getColor(min) {
          if (min === 0) return '#161b22';
          const ratio = Math.min(min / maxMin, 1);
          if (ratio < 0.25) return '#0e4429';
          if (ratio < 0.5) return '#006d32';
          if (ratio < 0.75) return '#26a641';
          return '#39d353';
        }

        let html = '<div class="calendar-header">';
        html += '<button id="prevYear">&#9664;</button>';
        html += '<span>' + year + '</span>';
        html += '<button id="nextYear">&#9654;</button>';
        html += '</div>';
        html += '<div class="calendar-grid">';

        var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

        for (var m = 0; m < 12; m++) {
          html += '<div class="month-block"><div class="month-title">' + monthNames[m] + '</div>';
          html += '<div class="month-grid">';

          var firstDay = new Date(year, m, 1).getDay();
          var daysInMonth = new Date(year, m + 1, 0).getDate();

          for (var i = 0; i < firstDay; i++) {
            html += '<div class="day-cell empty"></div>';
          }

          for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = year + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            var total = dailyTotals[dateStr] || 0;
            var color = getColor(total);
            html += '<div class="day-cell" style="background:' + color + '" data-date="' + dateStr + '" data-min="' + total + '">';
            html += '<span class="day-label">' + d + '</span>';
            html += '</div>';
          }

          html += '</div></div>';
        }

        html += '</div>';
        html += '<div class="legend">';
        html += '<span>少</span>';
        html += '<div class="legend-cell" style="background:#161b22"></div>';
        html += '<div class="legend-cell" style="background:#0e4429"></div>';
        html += '<div class="legend-cell" style="background:#006d32"></div>';
        html += '<div class="legend-cell" style="background:#26a641"></div>';
        html += '<div class="legend-cell" style="background:#39d353"></div>';
        html += '<span>多</span>';
        html += '</div>';

        container.innerHTML = html;

        // Year navigation
        document.getElementById('prevYear').addEventListener('click', function() {
          viewYear--;
          buildCalendar(viewYear);
        });
        document.getElementById('nextYear').addEventListener('click', function() {
          viewYear++;
          buildCalendar(viewYear);
        });

        // Day click
        container.querySelectorAll('.day-cell:not(.empty)').forEach(function(cell) {
          cell.addEventListener('click', function() {
            var date = cell.dataset.date;
            var recs = dailyRecords[date] || [];
            if (recs.length === 0) return;
            showDayDetail(date, recs);
          });
        });
      }

      function showDayDetail(date, recs) {
        var overlay = document.createElement('div');
        overlay.className = 'overlay';
        var detail = document.createElement('div');
        detail.className = 'day-detail';

        var html = '<button class="close-btn">&#10005;</button><h3>' + date + ' 时间记录</h3>';
        recs.forEach(function(r) {
          var hours = r.duration_min >= 60 ? Math.floor(r.duration_min/60) + 'h' + (r.duration_min%60 ? r.duration_min%60 + 'm' : '') : r.duration_min + 'm';
          html += '<div class="record-item"><span>' + r.activity + '</span><span>' + hours + '</span></div>';
        });
        var totalMin = recs.reduce(function(s, r) { return s + r.duration_min; }, 0);
        var totalH = Math.floor(totalMin / 60);
        var totalM = totalMin % 60;
        html += '<div class="record-item" style="font-weight:600;color:#f0f6fc;border-top:1px solid #30363d;padding-top:12px">';
        html += '<span>合计</span><span>' + (totalH ? totalH + 'h' : '') + totalM + 'm</span></div>';

        detail.innerHTML = html;
        document.body.appendChild(overlay);
        document.body.appendChild(detail);

        function close() {
          overlay.remove();
          detail.remove();
        }
        overlay.addEventListener('click', close);
        detail.querySelector('.close-btn').addEventListener('click', close);
      }

      buildCalendar(viewYear);
    }
    function renderTrend() {
      var container = document.getElementById('trend');
      var records = allData.records;

      // Get all unique activities
      var activitySet = {};
      records.forEach(function(r) { activitySet[r.activity] = true; });
      var activities = Object.keys(activitySet);

      // Color palette
      var colors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39d353','#db61a2','#79c0ff'];

      // Build controls
      var html = '<div class="trend-controls">';
      html += '<select id="trendRange"><option value="30">最近30天</option><option value="90">最近90天</option><option value="365">最近一年</option></select>';
      html += '</div>';

      // Activity filter tags
      html += '<div class="activity-tags">';
      activities.forEach(function(a, i) {
        html += '<span class="activity-tag active" data-activity="' + a + '" style="border-color:' + colors[i % colors.length] + ';color:' + colors[i % colors.length] + '">' + a + '</span>';
      });
      html += '</div>';

      html += '<div class="trend-chart-wrapper"><canvas id="trendCanvas"></canvas></div>';
      container.innerHTML = html;

      var chartInstance = null;
      var selectedActivities = {};
      activities.forEach(function(a) { selectedActivities[a] = true; });

      function buildChart() {
        var range = parseInt(document.getElementById('trendRange').value);
        var endDate = new Date();
        var startDate = new Date();
        startDate.setDate(endDate.getDate() - range);

        // Build date labels
        var labels = [];
        var d = new Date(startDate);
        while (d <= endDate) {
          labels.push(d.toISOString().slice(0, 10));
          d.setDate(d.getDate() + 1);
        }

        // Build datasets
        var datasets = [];
        activities.forEach(function(activity, i) {
          if (!selectedActivities[activity]) return;
          var data = labels.map(function(date) {
            var dayRecords = records.filter(function(r) { return r.date === date && r.activity === activity; });
            return dayRecords.reduce(function(s, r) { return s + r.duration_min; }, 0);
          });
          datasets.push({
            label: activity,
            data: data,
            borderColor: colors[i % colors.length],
            backgroundColor: colors[i % colors.length] + '20',
            tension: 0.3,
            pointRadius: range <= 30 ? 3 : 0,
            fill: false
          });
        });

        if (chartInstance) chartInstance.destroy();

        var canvas = document.getElementById('trendCanvas');
        chartInstance = new Chart(canvas, {
          type: 'line',
          data: { labels: labels, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
              x: {
                ticks: { color: '#8b949e', maxTicksLimit: 10 },
                grid: { color: '#21262d' }
              },
              y: {
                ticks: {
                  color: '#8b949e',
                  callback: function(v) { return v >= 60 ? Math.floor(v/60) + 'h' : v + 'm'; }
                },
                grid: { color: '#21262d' }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(ctx) {
                    var v = ctx.parsed.y;
                    return ctx.dataset.label + ': ' + (v >= 60 ? Math.floor(v/60) + 'h' + (v%60?v%60+'m':'') : v + 'm');
                  }
                }
              }
            }
          }
        });
      }

      // Event listeners
      document.getElementById('trendRange').addEventListener('change', buildChart);

      container.querySelectorAll('.activity-tag').forEach(function(tag) {
        tag.addEventListener('click', function() {
          var act = tag.dataset.activity;
          if (selectedActivities[act]) {
            delete selectedActivities[act];
            tag.classList.remove('active');
          } else {
            selectedActivities[act] = true;
            tag.classList.add('active');
          }
          buildChart();
        });
      });

      buildChart();
    }
    function renderReport() {
      var container = document.getElementById('report');
      var records = allData.records;

      var barColors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39d353','#db61a2','#79c0ff'];

      var currentRange = 'week';

      function getDateRange(range) {
        var now = new Date();
        var start = new Date();
        if (range === 'week') start.setDate(now.getDate() - 7);
        else if (range === 'month') start.setMonth(now.getMonth() - 1);
        else start.setFullYear(now.getFullYear() - 1);
        return { start: start, end: now };
      }

      function getPreviousRange(range) {
        var now = new Date();
        var end = new Date();
        var start = new Date();
        if (range === 'week') {
          start.setDate(now.getDate() - 14);
          end.setDate(now.getDate() - 7);
        } else if (range === 'month') {
          start.setMonth(now.getMonth() - 2);
          end.setMonth(now.getMonth() - 1);
        } else {
          start.setFullYear(now.getFullYear() - 2);
          end.setFullYear(now.getFullYear() - 1);
        }
        return { start: start, end: end };
      }

      function filterRecords(start, end) {
        var s = start.toISOString().slice(0,10);
        var e = end.toISOString().slice(0,10);
        return records.filter(function(r) { return r.date >= s && r.date <= e; });
      }

      function buildReport(range) {
        var dateRange = getDateRange(range);
        var prevRange = getPreviousRange(range);

        var current = filterRecords(dateRange.start, dateRange.end);
        var previous = filterRecords(prevRange.start, prevRange.end);

        // Aggregate by activity
        var activityTotals = {};
        current.forEach(function(r) {
          activityTotals[r.activity] = (activityTotals[r.activity] || 0) + r.duration_min;
        });

        var prevTotals = {};
        previous.forEach(function(r) {
          prevTotals[r.activity] = (prevTotals[r.activity] || 0) + r.duration_min;
        });

        // Sort by duration desc
        var sorted = Object.keys(activityTotals).map(function(k) {
          return [k, activityTotals[k]];
        }).sort(function(a, b) { return b[1] - a[1]; });

        var totalMin = sorted.reduce(function(s, item) { return s + item[1]; }, 0);
        var prevTotal = Object.keys(prevTotals).reduce(function(s, k) { return s + prevTotals[k]; }, 0);

        var maxMin = sorted.length > 0 ? sorted[0][1] : 1;

        var rangeLabels = { week: '本周', month: '本月', year: '本年' };
        var periodLabel = rangeLabels[range];

        // Format helpers
        function fmt(min) {
          if (min >= 60) {
            var h = Math.floor(min / 60);
            var m = min % 60;
            return m ? h + 'h' + m + 'm' : h + 'h';
          }
          return min + 'm';
        }

        function changeText(cur, prev) {
          if (prev === 0) return cur > 0 ? '<span class="change-up">新增</span>' : '<span class="change-same">—</span>';
          var diff = cur - prev;
          var pct = Math.round(Math.abs(diff) / prev * 100);
          if (diff > 0) return '<span class="change-up">+' + fmt(diff) + ' (↑' + pct + '%)</span>';
          if (diff < 0) return '<span class="change-down">' + fmt(diff) + ' (↓' + pct + '%)</span>';
          return '<span class="change-same">持平</span>';
        }

        var html = '<div class="report-range-controls">';
        ['week','month','year'].forEach(function(r) {
          html += '<button class="' + (r === range ? 'active' : '') + '" data-range="' + r + '">' + rangeLabels[r] + '</button>';
        });
        html += '</div>';

        html += '<div class="report-content">';

        // Summary section
        html += '<div class="report-section"><h3>' + periodLabel + '总览</h3>';
        html += '<div class="report-stat"><span class="label">总投入时间</span><span class="value">' + fmt(totalMin) + '</span></div>';
        html += '<div class="report-stat"><span class="label">记录条数</span><span class="value">' + current.length + ' 条</span></div>';
        html += '<div class="report-stat"><span class="label">活动种类</span><span class="value">' + sorted.length + ' 种</span></div>';
        html += '<div class="report-stat"><span class="label">与上个周期对比</span><span class="value">' + changeText(totalMin, prevTotal) + '</span></div>';
        html += '</div>';

        // Activity breakdown
        html += '<div class="report-section"><h3>活动排行</h3>';
        sorted.forEach(function(item, i) {
          var activity = item[0];
          var min = item[1];
          var pct = Math.round(min / totalMin * 100);
          var barWidth = Math.round(min / maxMin * 100);
          var prevMin = prevTotals[activity] || 0;
          html += '<div class="report-bar">';
          html += '<span class="bar-label">' + activity + '</span>';
          html += '<div class="bar-track"><div class="bar-fill" style="width:' + barWidth + '%;background:' + barColors[i % barColors.length] + '"></div></div>';
          html += '<span class="bar-value">' + fmt(min) + ' (' + pct + '%)</span>';
          html += '</div>';
          html += '<div class="report-stat" style="padding:2px 0 8px 88px;font-size:12px"><span class="label">环比</span>' + changeText(min, prevMin) + '</div>';
        });
        html += '</div>';

        // Top item
        if (sorted.length > 0) {
          html += '<div class="report-section"><h3>洞察</h3>';
          var topAct = sorted[0][0];
          var topMin = sorted[0][1];
          var topPct = Math.round(topMin / totalMin * 100);
          html += '<div class="report-stat"><span class="label">最大时间消耗</span><span class="value">' + topAct + '（' + fmt(topMin) + '，占' + topPct + '%）</span></div>';

          if (sorted.length >= 2) {
            var secondMin = sorted[1][1];
            var gap = topMin - secondMin;
            html += '<div class="report-stat"><span class="label">第一与第二差距</span><span class="value">' + fmt(gap) + '</span></div>';
          }

          // Average per day
          var dayCount = Math.max(1, Math.ceil((dateRange.end - dateRange.start) / (1000 * 60 * 60 * 24)));
          html += '<div class="report-stat"><span class="label">日均投入</span><span class="value">' + fmt(Math.round(totalMin / dayCount)) + '</span></div>';
          html += '</div>';
        }

        html += '</div>';
        container.innerHTML = html;

        // Range button events
        container.querySelectorAll('.report-range-controls button').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentRange = btn.dataset.range;
            buildReport(currentRange);
          });
        });
      }

      buildReport(currentRange);
    }

    loadData();
  </script>
</body>
</html>
